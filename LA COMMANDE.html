  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

tilo, leku mota bakoitzarentzat bat\",\n    designIntro: \"Ireki edozein zertan datzan ikusteko. Guztiak zure karta, argazki eta koloreetara moldatzen dira.\",\n    more: \"Diseinua ikusi →\", phone: \"Telefonoa\", forL: \"Norentzat da\", typeL: \"Tipografia eta kolorea\", cta: \"Diseinu hau eskatu\",\n    contactTag: \"Kontaktua\", contactTitle: \"Gaur hitz egin, bihar zirriborroa\",\n    contact: \"Idatzi nahi duzun bidetik. Komanda WhatsAppez jasotzen badut, zirriborroa eta epea bidaltzen dizut, konpromisorik gabe.\",\n    msgHead: \"Kaixo Samuel, web bat nahi dut La Commande-rekin.\", msgBase: \"Oinarrizko weba\", msgAdd: \"Gehigarriak\", msgNone: \"Gehigarririk gabe\", msgTotal: \"Guztira\", msgVenue: \"Lokala\",\n    venueLabel: \"Zure lokalaren izena\", venuePlace: \"Bar Txoko, Bideluze erretegia…\",\n    packLabel: \"Hasi pakete batekin\", packNote: \"Gero markatu edo kendu nahi duzuna.\",\n    infoLabel: \"Zer dakar\", guarantee: [\"Zirriborroa 24 ordutan\", \"Konbentzitzen ez bazaitu, ez duzu ezer ordaintzen.\"],\n    clientsTag: \"Bezeroak\", clientsTitle: \"Gure diseinuez fidatzen diren lokalak\"\n  },\n  en: {\n    nav: [\"Home\", \"Quote\", \"Designs\", \"Contact\"],\n    kicker: \"Websites for hospitality · Donostia\", trade: \"Websites for hospitality\",\n    heroItems: [[\"Custom design\", \"included\"], [\"Mobile version\", \"included\"], [\"Map and directions\", \"included\"], [\"Launch and setup\", \"included\"]],\n    ctaQuote: \"Build your quote\", ctaDesigns: \"See designs\",\n    quoteTag: \"Quote\", quoteTitle: \"Build your order, get the price instantly\",\n    quoteIntro: \"The base site is €29.99 a month and includes the map with directions. Each add-on is €4.99 a month, allergens €3.99, and Google reviews, your logo on the map or the three-language pack €2.99. When you are done it goes straight to my WhatsApp with everything you ticked.\",\n    fine: [\"No lock-in, cancel whenever you want.\", \"Hosting included.\", \"Domain separate, around €12 a year.\"],\n    perMonth: \"a month\", mail: \"Send by email\", mailSubject: \"La Commande order\", processNav: \"Process\",\n    processTag: \"How it works\", processTitle: \"Clear timings, little work for you\",\n    plazoLabel: \"Timings\", needLabel: \"What I need from you\",\n    plazos: [[\"Draft in 24 h\", \"I send it the day after your order reaches me.\"], [\"Online in 5 days\", \"You review, I fix it, it goes live.\"]],\n    needs: [[\"Your logo\", \"The file, or a photo of your sign or your card.\"], [\"Photos\", \"The ones you already use on Instagram work.\"], [\"The menu\", \"PDF, photo or paper. I put it on the site.\"]],\n    baseName: \"Base site\", wa: \"Send via WhatsApp\", waNote: \"Opens WhatsApp or your email with the order written out. No commitment.\",\n    steps: [\"Tick what you want\", \"The total updates itself\", \"It lands on my WhatsApp\"],\n    empty: \"No add-ons. The base site stands on its own.\",\n    designTag: \"Designs\", designTitle: \"Six styles, one for every kind of venue\",\n    designIntro: \"Open any of them to see what it involves. Each one adapts to your menu, your photos and your colour.\",\n    more: \"See the design →\", phone: \"Phone\", forL: \"Who it suits\", typeL: \"Type and colour\", cta: \"Ask for this design\",\n    contactTag: \"Contact\", contactTitle: \"Talk today, draft tomorrow\",\n    contact: \"Reach me however you like. Send the order on WhatsApp and I reply with a draft and a timeline, no strings attached.\",\n    msgHead: \"Hi Samuel, I'd like a website with La Commande.\", msgBase: \"Base site\", msgAdd: \"Add-ons\", msgNone: \"No add-ons\", msgTotal: \"Total\", msgVenue: \"Venue\",\n    venueLabel: \"Name of your venue\", venuePlace: \"Bar Txoko, Bideluze grill…\",\n    packLabel: \"Start from a pack\", packNote: \"Then tick or untick whatever you like.\",\n    infoLabel: \"What it includes\", guarantee: [\"Draft in 24 h\", \"If you don't like it, you pay nothing.\"],\n    clientsTag: \"Clients\", clientsTitle: \"Venues that trust our designs\"\n  }\n};\n\nconst ADDONS = [\n  { id: \"reservas\", es: [\"Reservas y formulario\", \"Los clientes reservan mesa sin llamar.\"], eu: [\"Erreserbak eta formularioa\", \"Bezeroek mahaia gordetzen dute deitu gabe.\"], en: [\"Bookings and form\", \"Guests book a table without calling.\"] },\n  { id: \"alergenos\", price: 3.99, es: [\"Alérgenos\", \"Los 14 alérgenos plato a plato, en regla.\"], eu: [\"Alergenoak\", \"14 alergenoak plateraz plater, araututa.\"], en: [\"Allergens\", \"All 14 allergens dish by dish, compliant.\"] },\n  { id: \"qr\", es: [\"Carta con QR en la mesa\", \"Un código y la carta se abre en su móvil.\"], eu: [\"QR karta mahaian\", \"Kode bat eta karta mugikorrean irekitzen da.\"], en: [\"QR menu for the table\", \"One code and the menu opens on their phone.\"] },\n  { id: \"galeria\", es: [\"Galería de fotos\", \"Tus fotos en grande, con carga rápida.\"], eu: [\"Argazki galeria\", \"Zure argazkiak handi eta azkar.\"], en: [\"Photo gallery\", \"Your photos big, and quick to load.\"] },\n  { id: \"pinlogo\", price: 2.99, es: [\"Tu logo en el mapa\", \"En vez del pin rojo de Google, tu marca.\"], eu: [\"Zure logoa mapan\", \"Googleren pin gorriaren ordez, zure marka.\"], en: [\"Your logo on the map\", \"Your mark instead of Google's red pin.\"] },\n  { id: \"resenas\", price: 2.99, es: [\"Reseñas de Google\", \"Tus mejores valoraciones, en portada.\"], eu: [\"Google iritziak\", \"Zure balorazio onenak, azalean.\"], en: [\"Google reviews\", \"Your best ratings, up front.\"] },\n  { id: \"pedidos\", es: [\"Pedidos para llevar\", \"El pedido te llega al WhatsApp ya sumado.\"], eu: [\"Eramateko eskaerak\", \"Eskaera WhatsAppera dator, batuta.\"], en: [\"Takeaway orders\", \"The order reaches your WhatsApp, totalled.\"] },\n  { id: \"eventos\", es: [\"Grupos y eventos\", \"Página aparte para menús de grupo.\"], eu: [\"Taldeak eta ekitaldiak\", \"Orri bereizia talde menuentzat.\"], en: [\"Groups and events\", \"A separate page for group menus.\"] },\n  { id: \"anim\", es: [\"Animaciones avanzadas\", \"Entradas suaves y transiciones cuidadas.\"], eu: [\"Animazio aurreratuak\", \"Sarrera leunak eta trantsizio zainduak.\"], en: [\"Advanced animation\", \"Soft reveals and careful transitions.\"] },\n  { id: \"pago\", es: [\"Pasarela de pago\", \"Cobra online reservas, pedidos o vales.\"], eu: [\"Ordainketa pasabidea\", \"Kobratu sarean erreserbak edo eskaerak.\"], en: [\"Payment gateway\", \"Charge online for bookings or orders.\"] },\n  { id: \"oscuro\", es: [\"Modo oscuro\", \"Dos versiones de la misma web.\"], eu: [\"Modu iluna\", \"Web beraren bi bertsio.\"], en: [\"Dark mode\", \"Two versions of the same site.\"] },\n  { id: \"idiomas\", price: 2.99, es: [\"Pack tres idiomas\", \"Español, euskera e inglés en un clic.\"], eu: [\"Hiru hizkuntzen paketea\", \"Gaztelania, euskara eta ingelesa klik batean.\"], en: [\"Three-language pack\", \"Spanish, Basque and English in one click.\"] }\n];\n\nconst DESIGNS = [\n  { id: \"oenso\", c: [\"#0A0908\", \"#C5A059\", \"#F5F2EB\"],\n    kind: { es: \"Negro y oro\", eu: \"Beltza eta urrea\", en: \"Black and gold\" },\n    title: { es: \"Nocturno\", eu: \"Gautarra\", en: \"Dark Night\" },\n    short: { es: \"Negro profundo, oro y serif clásica. Silencio y precio alto.\", eu: \"Beltz sakona, urrea eta serif klasikoa. Isiltasuna eta prezio altua.\", en: \"Deep black, gold and a classical serif. Silence and a high price point.\" },\n    long: { es: \"Todo se apoya en el vacío: mucho negro, un solo acento dorado y tipografía romana con mayúsculas espaciadas. La página abre a pantalla completa con el nombre centrado y el resto llega al desplazar. Pensado para que el local parezca más caro de lo que cuesta la web.\", eu: \"Dena hutsean oinarritzen da: beltz asko, urre ukitu bakarra eta maiuskula zabaleko tipografia erromatarra. Orria pantaila osoan irekitzen da izena erdian, eta gainerakoa jaisterakoan agertzen da. Lokala webak balio duena baino garestiago ager dadin.\", en: \"It leans on emptiness: mostly black, a single gold accent and a Roman face with wide caps. The page opens full-screen with the name centred and everything else arrives on scroll. Built to make the venue look more expensive than the site cost.\" },\n    who: { es: \"Restaurantes de temporada, asadores finos, bares de vinos, hoteles pequeños.\", eu: \"Sasoiko jatetxeak, erretegi finak, ardo-barrak, hotel txikiak.\", en: \"Seasonal restaurants, refined grills, wine bars, small hotels.\" },\n    type: { es: \"Cinzel y Cormorant Garamond · negro #0A0908, oro #C5A059, crema #F5F2EB.\", eu: \"Cinzel eta Cormorant Garamond · beltza #0A0908, urrea #C5A059, krema #F5F2EB.\", en: \"Cinzel and Cormorant Garamond · black #0A0908, gold #C5A059, cream #F5F2EB.\" } },\n  { id: \"buda\", c: [\"#0B0C0E\", \"#FF231D\", \"#FFD60A\"],\n    kind: { es: \"Rojo y ámbar\", eu: \"Gorria eta anbarra\", en: \"Red and amber\" },\n    title: { es: \"Neón\", eu: \"Neoia\", en: \"Neon\" },\n    short: { es: \"Fondo casi negro, rojo neón y farolillos. Ruido controlado.\", eu: \"Ia beltza den hondoa, neoi gorria eta argiontziak. Zarata kontrolatua.\", en: \"Near-black background, neon red and lanterns. Controlled noise.\" },\n    long: { es: \"Base casi negra con brillos rojos y ámbar, farolillos flotando y un cuenco de ramen dibujado a línea de fondo. La carta se lee en fichas con el precio destacado. Es el estilo con más carácter del catálogo y el que mejor funciona en móvil de noche.\", eu: \"Ia beltza den oinarria, gorri eta anbar distirekin, argiontzi flotatzaileak eta marraz egindako ramen katilu bat atzean. Karta fitxetan irakurtzen da, prezioa nabarmen. Katalogoko izaera handieneko estiloa da, eta gauez mugikorrean hoberen dabilena.\", en: \"Near-black base with red and amber glows, floating lanterns and a line-drawn ramen bowl behind. The menu reads as cards with the price standing out. The most characterful style here, and the one that works best on a phone at night.\" },\n    who: { es: \"Ramen, izakayas, bares de pintxos con carácter, food trucks.\", eu: \"Ramena, izakayak, izaera duten pintxo-barrak, food truck-ak.\", en: \"Ramen bars, izakayas, characterful pintxo bars, food trucks.\" },\n    type: { es: \"Shippori Mincho y Plus Jakarta Sans · negro #0B0C0E, rojo #FF231D, ámbar #FFD60A.\", eu: \"Shippori Mincho eta Plus Jakarta Sans · beltza #0B0C0E, gorria #FF231D, anbarra #FFD60A.\", en: \"Shippori Mincho and Plus Jakarta Sans · black #0B0C0E, red #FF231D, amber #FFD60A.\" } },\n  { id: \"oasis\", c: [\"#FBF7ED\", \"#C08B5C\", \"#3F4A3C\"],\n    kind: { es: \"Cálido artesanal\", eu: \"Artisau epela\", en: \"Warm artisan\" },\n    title: { es: \"Kafe\", eu: \"Kafe\", en: \"Kafe\" },\n    short: { es: \"Crema, serif suave y mucho aire. Se lee como una carta escrita a mano.\", eu: \"Krema, serif leuna eta aire asko. Eskuz idatzitako karta bat bezala.\", en: \"Cream, a soft serif and plenty of air. Reads like a handwritten menu.\" },\n    long: { es: \"Fondo crema, tipografía serif de trazo blando y precios en columnas limpias. Todo el peso lo llevan los productos: porciones, dulces del día, tazas. Incluye carrito ligero para pedidos de mostrador.\", eu: \"Krema koloreko hondoa, trazu bigunaren serif tipografia eta prezioak zutabe garbietan. Produktuek daramate pisua: zatiak, eguneko gozoak, katiluak. Barra-eskaerentzako saski arina barne.\", en: \"Cream background, a soft-stroked serif and prices in clean columns. The products carry the weight: slices, daily bakes, cups. Comes with a light cart for counter orders.\" },\n    who: { es: \"Cafeterías de especialidad, pastelerías, brunch, panaderías.\", eu: \"Kafetegi bereziak, gozotegiak, brunch lekuak, okindegiak.\", en: \"Specialty coffee, patisseries, brunch spots, bakeries.\" },\n    type: { es: \"Serif variable y sans neutra · crema #FBF7ED, caramelo #C08B5C, verde #3F4A3C.\", eu: \"Serif aldakorra eta sans neutroa · krema #FBF7ED, karamelua #C08B5C, berdea #3F4A3C.\", en: \"Variable serif and neutral sans · cream #FBF7ED, caramel #C08B5C, green #3F4A3C.\" } },\n  { id: \"barra\", c: [\"#143B2C\", \"#E8B94A\", \"#F2EFE4\"],\n    kind: { es: \"Verde botella\", eu: \"Botila berdea\", en: \"Bottle green\" },\n    title: { es: \"Bar de barra\", eu: \"Barrako taberna\", en: \"Corner bar\" },\n    short: { es: \"Verde botella, hueso y dorado. La pizarra del día en portada.\", eu: \"Botila berdea, hezurra eta urre kolorea. Eguneko arbela azalean.\", en: \"Bottle green, bone and gold. Today's board up front.\" },\n    long: { es: \"El más sociable de los seis: verde profundo de azulejo, letras hueso y un dorado de caña para los precios. Arriba va lo de hoy, la pizarra con cuatro pintxos y el menú, y debajo la barra completa en fichas anchas que se leen de un vistazo con el móvil en la mano.\", eu: \"Seietan sozialena: azulejuen berde sakona, hezur koloreko letrak eta garagardo urrea prezioetan. Goian gaurkoa doa, lau pintxo eta menuaren arbela, eta azpian barra osoa fitxa zabaletan, mugikorra eskuan begiratu batean irakurtzeko.\", en: \"The most sociable of the six: deep tiled green, bone lettering and a beer-gold accent on the prices. Today's board sits on top with four pintxos and the set menu, and the full bar follows in wide cards you can read at a glance on a phone.\" },\n    who: { es: \"Bares de barra, tabernas, sidrerías urbanas, cervecerías, bares de pintxos.\", eu: \"Barrako tabernak, sagardotegi hiritarrak, garagardotegiak, pintxo barrak.\", en: \"Corner bars, taverns, city cider houses, taprooms, pintxo bars.\" },\n    type: { es: \"Sans ancha y mono para precios · verde #143B2C, dorado #E8B94A, hueso #F2EFE4.\", eu: \"Sans zabala eta mono prezioetan · berdea #143B2C, urrea #E8B94A, hezurra #F2EFE4.\", en: \"Wide sans with mono prices · green #143B2C, gold #E8B94A, bone #F2EFE4.\" } },\n  { id: \"brunch\", c: [\"#F7F5F0\", \"#2F5D7C\", \"#E8DCC8\"],\n    kind: { es: \"Cal y azul\", eu: \"Karea eta urdina\", en: \"Lime and blue\" },\n    title: { es: \"Brunch mediterráneo\", eu: \"Brunch mediterraneoa\", en: \"Mediterranean brunch\" },\n    short: { es: \"Blanco cal, azul profundo y fotografía a sangre.\", eu: \"Kare zuria, urdin sakona eta argazkiak ertzera.\", en: \"Limewashed white, deep blue and full-bleed photography.\" },\n    long: { es: \"La más luminosa: paredes de cal, azul de contraste y fotos que ocupan la pantalla completa. Horarios y carta de mañanas en primer plano, reserva a un toque. Rinde muy bien cuando la mayoría de las visitas llegan desde Instagram.\", eu: \"Argitsuena: kare paretak, kontrasteko urdina eta pantaila osoa hartzen duten argazkiak. Ordutegiak eta goizeko karta lehen planoan, erreserba ukitu batera. Oso ondo dabil bisita gehienak Instagrametik datozenean.\", en: \"The brightest of the set: limewashed white, a contrasting blue and photos that fill the screen. Opening hours and the morning menu up front, booking one tap away. Performs well when most visits arrive from Instagram.\" },\n    who: { es: \"Brunch, terrazas, chiringuitos, hoteles de costa.\", eu: \"Brunch lekuak, terrazak, hondartzako barrak, kostako hotelak.\", en: \"Brunch spots, terraces, beach bars, coastal hotels.\" },\n    type: { es: \"Sans geométrica y serif ligera · cal #F7F5F0, azul #2F5D7C, arena #E8DCC8.\", eu: \"Sans geometrikoa eta serif arina · karea #F7F5F0, urdina #2F5D7C, harea #E8DCC8.\", en: \"Geometric sans and light serif · lime #F7F5F0, blue #2F5D7C, sand #E8DCC8.\" } },\n  { id: \"asador\", c: [\"#171310\", \"#B4531F\", \"#D8C9A8\"],\n    kind: { es: \"Madera y brasa\", eu: \"Egurra eta txingarra\", en: \"Wood and ember\" },\n    title: { es: \"Asador\", eu: \"Erretegia\", en: \"Grill house\" },\n    short: { es: \"Madera oscura, naranja brasa y el precio por kilo bien claro.\", eu: \"Egur iluna, txingar laranja eta kiloko prezioa argi.\", en: \"Dark wood, ember orange and price per kilo made obvious.\" },\n    long: { es: \"Rústico sin caer en el
