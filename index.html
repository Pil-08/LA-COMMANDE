  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

nim\", es: [\"Animaciones avanzadas\", \"Entradas suaves y transiciones cuidadas.\"], eu: [\"Animazio aurreratuak\", \"Sarrera leunak eta trantsizio zainduak.\"], en: [\"Advanced animation\", \"Soft reveals and careful transitions.\"] },\n  { id: \"pago\", es: [\"Pasarela de pago\", \"Cobra online reservas, pedidos o vales.\"], eu: [\"Ordainketa pasabidea\", \"Kobratu sarean erreserbak edo eskaerak.\"], en: [\"Payment gateway\", \"Charge online for bookings or orders.\"] },\n  { id: \"oscuro\", es: [\"Modo oscuro\", \"Dos versiones de la misma web.\"], eu: [\"Modu iluna\", \"Web beraren bi bertsio.\"], en: [\"Dark mode\", \"Two versions of the same site.\"] },\n  { id: \"idiomas\", price: 2.99, es: [\"Pack tres idiomas\", \"Español, euskera e inglés en un clic.\"], eu: [\"Hiru hizkuntzen paketea\", \"Gaztelania, euskara eta ingelesa klik batean.\"], en: [\"Three-language pack\", \"Spanish, Basque and English in one click.\"] }\n];\n\nconst DESIGNS = [\n  { id: \"oenso\", c: [\"#0A0908\", \"#C5A059\", \"#F5F2EB\"],\n    kind: { es: \"Negro y oro\", eu: \"Beltza eta urrea\", en: \"Black and gold\" },\n    title: { es: \"Nocturno\", eu: \"Gautarra\", en: \"Dark Night\" },\n    short: { es: \"Negro profundo, oro y serif clásica. Silencio y precio alto.\", eu: \"Beltz sakona, urrea eta serif klasikoa. Isiltasuna eta prezio altua.\", en: \"Deep black, gold and a classical serif. Silence and a high price point.\" },\n    long: { es: \"Todo se apoya en el vacío: mucho negro, un solo acento dorado y tipografía romana con mayúsculas espaciadas. La página abre a pantalla completa con el nombre centrado y el resto llega al desplazar. Pensado para que el local parezca más caro de lo que cuesta la web.\", eu: \"Dena hutsean oinarritzen da: beltz asko, urre ukitu bakarra eta maiuskula zabaleko tipografia erromatarra. Orria pantaila osoan irekitzen da izena erdian, eta gainerakoa jaisterakoan agertzen da. Lokala webak balio duena baino garestiago ager dadin.\", en: \"It leans on emptiness: mostly black, a single gold accent and a Roman face with wide caps. The page opens full-screen with the name centred and everything else arrives on scroll. Built to make the venue look more expensive than the site cost.\" },\n    who: { es: \"Restaurantes de temporada, asadores finos, bares de vinos, hoteles pequeños.\", eu: \"Sasoiko jatetxeak, erretegi finak, ardo-barrak, hotel txikiak.\", en: \"Seasonal restaurants, refined grills, wine bars, small hotels.\" },\n    type: { es: \"Cinzel y Cormorant Garamond · negro #0A0908, oro #C5A059, crema #F5F2EB.\", eu: \"Cinzel eta Cormorant Garamond · beltza #0A0908, urrea #C5A059, krema #F5F2EB.\", en: \"Cinzel and Cormorant Garamond · black #0A0908, gold #C5A059, cream #F5F2EB.\" } },\n  { id: \"buda\", c: [\"#0B0C0E\", \"#FF231D\", \"#FFD60A\"],\n    kind: { es: \"Rojo y ámbar\", eu: \"Gorria eta anbarra\", en: \"Red and amber\" },\n    title: { es: \"Neón\", eu: \"Neoia\", en: \"Neon\" },\n    short: { es: \"Fondo casi negro, rojo neón y farolillos. Ruido controlado.\", eu: \"Ia beltza den hondoa, neoi gorria eta argiontziak. Zarata kontrolatua.\", en: \"Near-black background, neon red and lanterns. Controlled noise.\" },\n    long: { es: \"Base casi negra con brillos rojos y ámbar, farolillos flotando y un cuenco de ramen dibujado a línea de fondo. La carta se lee en fichas con el precio destacado. Es el estilo con más carácter del catálogo y el que mejor funciona en móvil de noche.\", eu: \"Ia beltza den oinarria, gorri eta anbar distirekin, argiontzi flotatzaileak eta marraz egindako ramen katilu bat atzean. Karta fitxetan irakurtzen da, prezioa nabarmen. Katalogoko izaera handieneko estiloa da, eta gauez mugikorrean hoberen dabilena.\", en: \"Near-black base with red and amber glows, floating lanterns and a line-drawn ramen bowl behind. The menu reads as cards with the price standing out. The most characterful style here, and the one that works best on a phone at night.\" },\n    who: { es: \"Ramen, izakayas, bares de pintxos con carácter, food trucks.\", eu: \"Ramena, izakayak, izaera duten pintxo-barrak, food truck-ak.\", en: \"Ramen bars, izakayas, characterful pintxo bars, food trucks.\" },\n    type: { es: \"Shippori Mincho y Plus Jakarta Sans · negro #0B0C0E, rojo #FF231D, ámbar #FFD60A.\", eu: \"Shippori Mincho eta Plus Jakarta Sans · beltza #0B0C0E, gorria #FF231D, anbarra #FFD60A.\", en: \"Shippori Mincho and Plus Jakarta Sans · black #0B0C0E, red #FF231D, amber #FFD60A.\" } },\n  { id: \"oasis\", c: [\"#FBF7ED\", \"#C08B5C\", \"#3F4A3C\"],\n    kind: { es: \"Cálido artesanal\", eu: \"Artisau epela\", en: \"Warm artisan\" },\n    title: { es: \"Kafe\", eu: \"Kafe\", en: \"Kafe\" },\n    short: { es: \"Crema, serif suave y mucho aire. Se lee como una carta escrita a mano.\", eu: \"Krema, serif leuna eta aire asko. Eskuz idatzitako karta bat bezala.\", en: \"Cream, a soft serif and plenty of air. Reads like a handwritten menu.\" },\n    long: { es: \"Fondo crema, tipografía serif de trazo blando y precios en columnas limpias. Todo el peso lo llevan los productos: porciones, dulces del día, tazas. Incluye carrito ligero para pedidos de mostrador.\", eu: \"Krema koloreko hondoa, trazu bigunaren serif tipografia eta prezioak zutabe garbietan. Produktuek daramate pisua: zatiak, eguneko gozoak, katiluak. Barra-eskaerentzako saski arina barne.\", en: \"Cream background, a soft-stroked serif and prices in clean columns. The products carry the weight: slices, daily bakes, cups. Comes with a light cart for counter orders.\" },\n    who: { es: \"Cafeterías de especialidad, pastelerías, brunch, panaderías.\", eu: \"Kafetegi bereziak, gozotegiak, brunch lekuak, okindegiak.\", en: \"Specialty coffee, patisseries, brunch spots, bakeries.\" },\n    type: { es: \"Serif variable y sans neutra · crema #FBF7ED, caramelo #C08B5C, verde #3F4A3C.\", eu: \"Serif aldakorra eta sans neutroa · krema #FBF7ED, karamelua #C08B5C, berdea #3F4A3C.\", en: \"Variable serif and neutral sans · cream #FBF7ED, caramel #C08B5C, green #3F4A3C.\" } },\n  { id: \"barra\", c: [\"#143B2C\", \"#E8B94A\", \"#F2EFE4\"],\n    kind: { es: \"Verde botella\", eu: \"Botila berdea\", en: \"Bottle green\" },\n    title: { es: \"Bar de barra\", eu: \"Barrako taberna\", en: \"Corner bar\" },\n    short: { es: \"Verde botella, hueso y dorado. La pizarra del día en portada.\", eu: \"Botila berdea, hezurra eta urre kolorea. Eguneko arbela azalean.\", en: \"Bottle green, bone and gold. Today's board up front.\" },\n    long: { es: \"El más sociable de los seis: verde profundo de azulejo, letras hueso y un dorado de caña para los precios. Arriba va lo de hoy, la pizarra con cuatro pintxos y el menú, y debajo la barra completa en fichas anchas que se leen de un vistazo con el móvil en la mano.\", eu: \"Seietan sozialena: azulejuen berde sakona, hezur koloreko letrak eta garagardo urrea prezioetan. Goian gaurkoa doa, lau pintxo eta menuaren arbela, eta azpian barra osoa fitxa zabaletan, mugikorra eskuan begiratu batean irakurtzeko.\", en: \"The most sociable of the six: deep tiled green, bone lettering and a beer-gold accent on the prices. Today's board sits on top with four pintxos and the set menu, and the full bar follows in wide cards you can read at a glance on a phone.\" },\n    who: { es: \"Bares de barra, tabernas, sidrerías urbanas, cervecerías, bares de pintxos.\", eu: \"Barrako tabernak, sagardotegi hiritarrak, garagardotegiak, pintxo barrak.\", en: \"Corner bars, taverns, city cider houses, taprooms, pintxo bars.\" },\n    type: { es: \"Sans ancha y mono para precios · verde #143B2C, dorado #E8B94A, hueso #F2EFE4.\", eu: \"Sans zabala eta mono prezioetan · berdea #143B2C, urrea #E8B94A, hezurra #F2EFE4.\", en: \"Wide sans with mono prices · green #143B2C, gold #E8B94A, bone #F2EFE4.\" } },\n  { id: \"brunch\", c: [\"#F7F5F0\", \"#2F5D7C\", \"#E8DCC8\"],\n    kind: { es: \"Cal y azul\", eu: \"Karea eta urdina\", en: \"Lime and blue\" },\n    title: { es: \"Brunch mediter
