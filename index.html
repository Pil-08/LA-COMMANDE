  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

02Fbutton>\n      <span style=\"color: rgba(17,17,17,0.2)\">/<\u002Fspan>\n      <button sc-camel-on-click=\"{{ setEu }}\" aria-label=\"Euskara\" aria-pressed=\"{{ presEu }}\" style=\"background: none; border: 0; cursor: pointer; min-width: 42px; min-height: 42px; font-family: inherit; font-weight: inherit; letter-spacing: inherit; color: {{ colEu }}\">EU<\u002Fbutton>\n      <span style=\"color: rgba(17,17,17,0.2)\">/<\u002Fspan>\n      <button sc-camel-on-click=\"{{ setEn }}\" aria-label=\"English\" aria-pressed=\"{{ presEn }}\" style=\"background: none; border: 0; cursor: pointer; min-width: 42px; min-height: 42px; font-family: inherit; font-weight: inherit; letter-spacing: inherit; color: {{ colEn }}\">EN<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"inicio\" style=\"position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 104px clamp(14px, 4vw, 56px) 56px; background: #FF231D; overflow: hidden\">\n    <img src=\"0a3e3403-7cd9-4f38-acc6-2441e835f6c6\" alt=\"\" style=\"position: absolute; right: -4vw; bottom: -6vh; height: 118vh; width: auto; opacity: 0.13; pointer-events: none\">\n    <div id=\"heroTicket\" style=\"position: relative; width: min(1080px, 100%); background: transparent; padding: clamp(24px, 3.2vw, 42px) clamp(20px, 4vw, 56px) clamp(26px, 3.4vw, 44px); border: 1px solid rgba(255,255,255,0.45)\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: clamp(11px, 1.3vw, 14px); letter-spacing: 0.16em; color: #FFFFFF\">\n        <span>COMMANDE<\u002Fspan>\n        <span>Nº 001<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid rgba(255,255,255,0.45); margin: 14px 0 clamp(26px, 4vw, 44px)\"><\u002Fdiv>\n\n      <h1 id=\"heroTitle\" style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: clamp(50px, 10vw, 140px); line-height: 0.86; letter-spacing: -0.02em; text-transform: uppercase; text-align: center; color: #FFFFFF\">La Commande<\u002Fh1>\n      <p style=\"text-align: center; margin-top: clamp(16px, 2vw, 26px); font-family: 'Roboto Mono', monospace; font-size: clamp(11px, 1.3vw, 14px); font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.85)\">{{ heroKicker }}<\u002Fp>\n\n      <div style=\"border-top: 1px dotted rgba(255,255,255,0.6); margin: clamp(26px, 4vw, 44px) 0 22px\"><\u002Fdiv>\n      <div id=\"heroLines\" style=\"display: flex; flex-direction: column; gap: 12px; font-family: 'Roboto Mono', monospace; font-size: clamp(12.5px, 1.25vw, 14px); color: #FFFFFF\">\n        <sc-for list=\"{{ heroItems }}\" as=\"line\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 20px 1fr auto; gap: 14px; align-items: baseline\">\n            <span style=\"opacity: 0.7\">1<\u002Fspan>\n            <span style=\"text-transform: uppercase; letter-spacing: 0.06em\">{{ line.name }}<\u002Fspan>\n            <span style=\"opacity: 0.75\">{{ line.value }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid #FFFFFF; margin: 22px 0 18px\"><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px 28px; justify-content: space-between; align-items: center\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: clamp(15px, 1.8vw, 20px); letter-spacing: 0.02em; color: #FFFFFF\">TOTAL<\u002Fspan>\n          <span style=\"display: flex; align-items: baseline; gap: 8px\">\n            <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: clamp(22px, 3vw, 38px); color: #FFFFFF\">{{ heroTotal }}<\u002Fspan>\n            <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: clamp(11px, 1.3vw, 13px); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.85)\">{{ perMonth }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <a href=\"#presupuesto\" style=\"padding: 14px 26px; background: #FFFFFF; color: #FF231D; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase\" style-hover=\"background:#111111;color:#FFFFFF\">{{ ctaQuote }}<\u002Fa>\n          <a href=\"#disenos\" style=\"padding: 14px 26px; border: 1px solid rgba(255,255,255,0.6); color: #FFFFFF; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase\" style-hover=\"background:rgba(255,255,255,0.14);border-color:#FFFFFF\">{{ ctaDesigns }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"presupuesto\" style=\"padding: clamp(70px, 9vw, 120px) clamp(16px, 4vw, 56px); background: #F4F4F2; color: #111111\">\n    <div style=\"max-width: 1180px; margin: 0 auto\">\n      <p style=\"font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #FF231D; margin-bottom: 16px\">01 / {{ quoteTag }}<\u002Fp>\n      <h2 style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -0.02em; text-transform: uppercase; max-width: 22ch; margin-bottom: 18px\">{{ quoteTitle }}<\u002Fh2>\n      <p style=\"max-width: 62ch; color: #4B4B48; font-size: 15.5px; line-height: 1.7\">{{ quoteIntro }}<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 26px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px; background: # th a light cart for counter orders.\" },\n    who: { es: \"Cafeterías de especialidad, pastelerías, brunch, panaderías.\", eu: \"Kafetegi bereziak, gozotegiak, brunch lekuak, okindegiak.\", en: \"Specialty coffee, patisseries, brunch spots, bakeries.\" },\n    type: { es: \"Serif variable y sans neutra · crema #FBF7ED, caramelo #C08B5C, verde #3F4A3C.\", eu: \"Serif aldakorra eta sans neutroa · krema #FBF7ED, karamelua #C08B5C, berdea #3F4A3C.\", en: \"Variable serif and neutral sans · cream #FBF7ED, caramel #C08B5C, green #3F4A3C.\" } },\n  { id: \"barra\", c: [\"#143B2C\", \"#E8B94A\", \"#F2EFE4\"],\n    kind: { es: \"Verde botella\", eu: \"Botila berdea\", en: \"Bottle green\" },\n    title: { es: \"Bar de barra\", eu: \"Barrako taberna\", en: \"Corner bar\" },\n    short: { es: \"Verde botella, hueso y dorado. La pizarra del día en portada.\", eu: \"Botila berdea, hezurra eta urre kolorea. Eguneko arbela azalean.\", en: \"Bottle green, bone and gold. Today's board up front.\" },\n    long: { es: \"El más sociable de los seis: verde profundo de azulejo, letras hueso y un dorado de caña para los precios. Arriba va lo de hoy, la pizarra con cuatro pintxos y el menú, y debajo la barra completa en fichas anchas que se leen de un vistazo con el móvil en la mano.\", eu: \"Seietan sozialena: azulejuen berde sakona, hezur koloreko letrak eta garagardo urrea prezioetan. Goian gaurkoa doa, lau pintxo eta menuaren arbela, eta azpian barra osoa fitxa zabaletan, mugikorra eskuan begiratu batean irakurtzeko.\", en: \"The most sociable of the six: deep tiled green, bone lettering and a beer-gold accent on the prices. Today's board sits on top with four pintxos and the set menu, and the full bar follows in wide cards you can read at a glance on a phone.\" },\n    who: { es: \"Bares de barra, tabernas, sidrerías urbanas, cervecerías, bares de pintxos.\", eu: \"Barrako tabernak, sagardotegi hiritarrak, garagardotegiak, pintxo barrak.\", en: \"Corner bars, taverns, city cider house
