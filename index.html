    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

    console.error('[bundle] ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : ''));

3\", \"#E4573D\"],\n    kind: { es: \"Rosa y azul profundo\", eu: \"Arrosa eta urdin sakona\", en: \"Blush and deep blue\" },\n    title: { es: \"Coctelería\", eu: \"Koktelerria\", en: \"Cocktail bar\" },\n    short: { es: \"Serif de alto contraste, arco azul y una copa. Elegante sin ser caro.\", eu: \"Kontraste handiko serifa, arku urdina eta kopa bat. Dotorea, garestia izan gabe.\", en: \"High-contrast serif, a blue arch and a coupe glass. Elegant without being pricey.\" },\n    long: { es: \"Una pareja de colores poco habitual en hostelería: rosa pálido y azul de tinta, con un toque de coral. Serif de alto contraste para los títulos, una copa ilustrada dentro de un arco y una carta de cócteles con su fuerza y su sabor. Incluye ticket de hora feliz y bloque de reservas.\", eu: \"Ostalaritzan ohikoa ez den kolore bikotea: arrosa zurbila eta tinta-urdina, koral ukitu batekin. Tituluetarako serif kontrastetsua, arku baten barruko kopa marraztua eta bere indar eta zaporea duten koktelen karta. Ordu zoriontsuaren tiketa eta erreserba-blokea ditu.\", en: \"A colour pairing you rarely see in hospitality: pale pink and ink blue, with a touch of coral. A high-contrast serif for the titles, an illustrated glass inside an arch and a cocktail list with its strength and flavour. Includes a happy-hour ticket and a booking block.\" },\n    who: { es: \"Coctelerías, bares de vinos, vermuterías y bares de copas.\", eu: \"Koktelerriak, ardo-barrak, bermuteriak eta kopa-barrak.\", en: \"Cocktail bars, wine bars, vermouth bars and late-night bars.\" },\n    type: { es: \"Bodoni Moda e Inter Tight · rosa #F4DCD0, azul #123E73, coral #E4573D.\", eu: \"Bodoni Moda eta Inter Tight · arrosa #F4DCD0, urdina #123E73, korala #E4573D.\", en: \"Bodoni Moda and Inter Tight · blush #F4DCD0, blue #123E73, coral #E4573D.\" } },\n  { id: \"asador\", c: [\"#151513\", \"#D9531E\", \"#FAF8F3\"],\n    kind: { es: \"Carbón y brasa\", eu: \"Ikatza eta txingarra\", en: \"Charcoal and ember\" },\n    title
